services:
  db:
    image: mariadb:11.4
    container_name: beer-journal-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-beerjournal}
      MARIADB_USER: ${DB_USER:-beerjournal}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: .
    container_name: beer-journal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://${DB_USER:-beerjournal}:${DB_PASSWORD}@db:3306/${DB_NAME:-beerjournal}?charset=utf8mb4
      UPLOAD_FOLDER: /app/uploads
      MAX_CONTENT_LENGTH: 10485760
      TZ: ${TZ:-America/Toronto}
    ports:
      - "${APP_PORT:-8088}:5000"
    volumes:
      - beer_uploads:/app/uploads

volumes:
  mariadb_data:
  beer_uploads:
