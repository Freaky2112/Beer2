{% extends "base.html" %}{% block title %}{{t('register')}} · Beer Journal{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><h1>Join Beer <em>Journal</em></h1><p class="muted">Create your personal tasting account.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<label class="form-label">{{t('username')}}</label><input class="form-control mb-3" name="username" minlength="3" maxlength="50" required>
<label class="form-label">{{t('email')}}</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">{{t('password')}}</label><input class="form-control mb-2" type="password" name="password" minlength="8" required><small class="muted">{{t('password_help')}}</small>
<label class="form-label mt-3">{{t('confirm_password')}}</label><input class="form-control mb-3" type="password" name="confirm_password" required>
<button class="btn btn-amber w-100">{{t('register')}}</button></form><p class="mt-3 mb-0 muted">Already registered? <a href="{{url_for('login')}}">{{t('login')}}</a></p></div></div>{% endblock %}
