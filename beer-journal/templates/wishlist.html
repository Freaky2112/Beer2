{% extends "base.html" %}{% block content %}<div class="section-head"><div><div class="eyebrow">NEXT UP</div><h1>{{t('wishlist')}}</h1></div></div>
<div class="row g-4"><div class="col-12 col-lg-5"><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h3>{{t('add_wishlist')}}</h3><label class="form-label">{{t('beer')}} *</label><input class="form-control mb-3" name="beer_name" required><label class="form-label">{{t('brewery')}}</label><input class="form-control mb-3" name="brewery_name"><label class="form-label">{{t('style')}}</label><input class="form-control mb-3" name="style"><label class="form-label">{{t('notes')}}</label><textarea class="form-control mb-3" name="notes" rows="3"></textarea><button class="btn btn-amber">{{t('wishlist_add')}}</button></form></div>
<div class="col-12 col-lg-7">{% for item in items %}<div class="panel wishlist-card mb-3"><div><h3>♡ {{item.beer_name}}</h3><p class="muted">{{item.brewery_name}} · {{item.style}}</p><p>{{item.notes}}</p></div><form method="post" action="{{url_for('wishlist_delete',item_id=item.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-outline-danger btn-sm">{{t('remove')}}</button></form></div>{% else %}<div class="empty panel">Your next great beer is waiting to be discovered.</div>{% endfor %}</div></div>{% endblock %}
