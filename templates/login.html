{% extends "base.html" %}{% block title %}{{t('login')}} · Beer Journal{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="can-mark">🍺</div><h1>Beer <em>Journal</em></h1><p class="muted">{{t('welcome')}}</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<label class="form-label">{{t('username')}} / {{t('email')}}</label><input class="form-control mb-3" name="identity" required autofocus>
<label class="form-label">{{t('password')}}</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-amber w-100">{{t('login')}}</button></form><p class="mt-3 mb-0 muted">New here? <a href="{{url_for('register')}}">Create an account</a></p></div></div>{% endblock %}
