{% extends "base.html" %}{% block content %}<div class="section-head"><h1>{{t('add_beer') if not beer else t('edit')}}</h1><a href="{{url_for('beers')}}" class="muted">{{t('cancel')}}</a></div>
<form method="post" enctype="multipart/form-data" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">
<div class="row g-3"><div class="col-12 col-md-6"><label class="form-label">{{t('beer')}} *</label><input class="form-control" name="name" required maxlength="140" value="{{beer.name if beer else ''}}"></div>
<div class="col-12 col-md-6"><label class="form-label">{{t('brewery')}}</label><select class="form-select" name="brewery_id"><option value="">—</option>{% for b in breweries %}<option value="{{b.id}}" {% if beer and beer.brewery_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select><small class="muted">Add breweries in the Breweries section.</small></div>
<div class="col-12 col-md-4"><label class="form-label">{{t('style')}}</label><input class="form-control" name="style" list="styles" value="{{beer.style if beer else ''}}" placeholder="e.g. Imperial Stout"><datalist id="styles"><option>Stout</option><option>Imperial Stout</option><option>IPA</option><option>NEIPA</option><option>Pale Ale</option><option>Lager</option><option>Pilsner</option><option>Sour</option><option>Porter</option><option>Wheat Beer</option></datalist></div>
<div class="col-6 col-md-2"><label class="form-label">{{t('abv')}}</label><input class="form-control" type="number" name="abv" min="0" max="100" step=".1" value="{{beer.abv if beer and beer.abv is not none else ''}}"></div>
<div class="col-6 col-md-2"><label class="form-label">{{t('ibu')}}</label><input class="form-control" type="number" name="ibu" min="0" max="2000" value="{{beer.ibu if beer and beer.ibu is not none else ''}}"></div>
<div class="col-12 col-md-4"><label class="form-label">{{t('temperature')}}</label><input class="form-control" name="serving_temp" value="{{beer.serving_temp if beer else ''}}" placeholder="e.g. 8–10 °C"></div>
<div class="col-12 col-md-4"><label class="form-label">{{t('rating')}} *</label><input class="form-control" type="number" name="rating" min="0" max="10" step=".5" required value="{{beer.rating if beer else '7.5'}}"><small class="muted">0–10, half-point steps</small></div>
<div class="col-12 col-md-4"><label class="form-label">{{t('tasted_on')}}</label><input class="form-control" type="date" name="tasted_on" value="{{beer.tasted_on.isoformat() if beer else today.isoformat()}}"></div>
<div class="col-12 col-md-4"><label class="form-label">{{t('photo')}}</label><input class="form-control" type="file" name="photo" accept="image/jpeg,image/png,image/webp"><small class="muted">JPG, PNG or WebP · max 10 MB</small></div>
<div class="col-12"><label class="form-label">{{t('flavours')}}</label><input class="form-control" name="tags" value="{{', '.join(tag.name for tag in beer.tags) if beer else ''}}" placeholder="Coffee, Chocolate, Roasted, Citrus, Pine"><small class="muted">Separate tags with commas. New tags are created automatically.</small></div>
<div class="col-12"><label class="form-label">{{t('notes')}}</label><textarea class="form-control" name="tasting_notes" rows="5" placeholder="Appearance, aroma, taste, mouthfeel, finish...">{{beer.tasting_notes if beer else ''}}</textarea></div>
</div><div class="mt-4"><button class="btn btn-amber">{{t('save')}}</button></div></form>{% endblock %}
